<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seekho Online</title>
  <meta name="description" content="Maths, Science aur English ke free notes aur quizzes, aasan bhasha me.">
  <meta property="og:title" content="Seekho Online">
  <meta property="og:description" content="Free notes aur quizzes, school ke students ke liye.">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" media="print" onload="this.media='all'">
<noscript>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap">
</noscript>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header id="site-header"></header>

  <main class="quiz-box">

    <div id="category-box">
      <h2>Category chunein</h2>
      <button class="btn cat-btn" data-cat="maths">Maths</button>
      <button class="btn cat-btn" data-cat="science">Science</button>
      <button class="btn cat-btn" data-cat="english">English</button>
      <button class="btn cat-btn" data-cat="all">Sab milake</button>
    </div>

    <div id="quiz" style="display:none;">
      <p id="progress"></p>
      <p id="timer"></p>
      <h2 id="sawal"></h2>
      <div id="options"></div>
      <p id="feedback"></p>
      <p id="explain"></p>
      <button id="next-btn" class="btn" style="display:none;">Next</button>
    </div>

    <div id="result" style="display:none;">
      <h2>Quiz khatam!</h2>
      <p id="score-text"></p>
      <p id="best-text"></p>
      <button id="restart-btn" class="btn">Dobara khelein</button>
    </div>

  </main>

  <footer id="site-footer"></footer>
  <script src="js/layout.js"></script>
  <script src="js/script.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/quiz.js"></script>

</body>

</html>
