<body>

  <header id="site-header"></header>

  <main>
    <section class="hero">
      <h2>Aasan bhasha me padhai</h2>
      <p>Maths, Science aur English ke notes aur quizzes, bilkul free.</p>
      <a class="btn" href="lessons.html">Padhai shuru karein</a>
      <br>
      <img src="images/students.webp.jpg" alt="Padhte hue bachche" class="hero-img" width="800" height="450" fetchpriority="high">
    </section>

<section class="dashboard">
  <h3>Aapki padhai</h3>

  <p id="home-progress-text"></p>
  <div class="bar"><div id="home-bar-fill"></div></div>

  <div class="score-grid">
    <div class="score-card">
      <small>Maths</small>
      <strong id="best-maths">-</strong>
    </div>
    <div class="score-card">
      <small>Science</small>
      <strong id="best-science">-</strong>
    </div>
    <div class="score-card">
      <small>English</small>
      <strong id="best-english">-</strong>
    </div>
  </div>
    <button id="reset-btn" class="reset-btn">Progress reset karein</button>
</section>


    <section class="quote-box">
      <h3>Aaj ka vichar</h3>
      <p id="quote-text">Load ho raha hai...</p>
      <small id="quote-author"></small>
      <br>
      <button id="new-quote" class="btn">Naya vichar</button>
    </section>

    <section class="subjects">
      <div class="card">
        <h3>Maths</h3>
        <p>Algebra, Geometry</p>
      </div>
      <div class="card">
        <h3>Science</h3>
        <p>Physics, Chemistry</p>
      </div>
      <div class="card">
        <h3>English</h3>
        <p>Grammar, Writing</p>
