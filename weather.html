<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Seekho Online</title>
  <meta name="description" content="Maths, Science aur English ke free notes aur quizzes, aasan bhasha me.">
  <meta property="og:title" content="Seekho Online">
  <meta property="og:description" content="Free notes aur quizzes, school ke students ke liye.">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

  <header id="site-header"></header>

  <main class="weather-box">
    <h2>Mausam ki jaankari</h2>

    <div class="weather-search">
      <input type="text" id="city-input" placeholder="Shehar ka naam (jaise Delhi)">
      <button id="city-btn" class="btn">Dhundhein</button>
    </div>

    <p id="weather-msg"></p>

    <div id="weather-card" style="display:none;">
      <h3 id="w-city"></h3>
      <p id="w-temp"></p>
      <p id="w-desc"></p>
      <p id="w-extra"></p>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/layout.js"></script>
  <script src="js/script.js"></script>
  <script src="js/weather.js"></script>

</body>
