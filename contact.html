    <main class="contact-box">
        <h2>Humse sampark karein</h2>

        <form id="contact-form" novalidate>
            <label for="naam">Naam</label>
            <input type="text" id="naam" placeholder="Aapka naam">
            <small class="error" id="naam-error"></small>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="aap@example.com">
            <small class="error" id="email-error"></small>

            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="Aapka sandesh"></textarea>
            <small class="error" id="message-error"></small>

            <button type="submit" class="btn">Bhejein</button>
        </form>

        <p id="success" style="display:none;">Dhanyavaad! Aapka message mil gaya.</p>
