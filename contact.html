<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seekho Online</title>
    <meta name="description" content="Maths, Science aur English ke free notes aur quizzes, aasan bhasha me.">
    <meta property="og:title" content="Seekho Online">
    <meta property="og:description" content="Free notes aur quizzes, school ke students ke liye.">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header id="site-header"></header>

    <main class="contact-box">
        <h2>Humse sampark karein</h2>

        <form id="contact-form" novalidate>
            <label for="naam">Naam</label>
            <input type="text" id="naam" placeholder="Aapka naam">
            <small class="error" id="naam-error"></small>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="aap@example.com">
            <small class="error" id="email-error"></small>

            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="Aapka sandesh"></textarea>
            <small class="error" id="message-error"></small>

            <button type="submit" class="btn">Bhejein</button>
        </form>

        <p id="success" style="display:none;">Dhanyavaad! Aapka message mil gaya.</p>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/layout.js"></script>
    <script src="js/script.js"></script>
    <script src="js/contact.js"></script>

</body>

</html>
